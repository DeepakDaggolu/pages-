name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html app.js style.css manifest.json icon-192.png icon-512.png www/
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "pages!" io.github.deepakdaggolu.pages --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pages-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: pages! APK (latest)
          files: android/app/build/outputs/apk/debug/app-debug.apk
